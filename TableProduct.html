<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Dog Day</title>
</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #f7f8fc;
        color: #1d2939;
        font-family: Arial, Helvetica, sans-serif;
    }

    .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 12px clamp(20px, 6vw, 90px);
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.06);
    }

    .navbar-brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
    }

    .navbar-logo {
        display: block;
        width: 120px;
        max-height: 52px;
        object-fit: contain;
        object-position: left center;
    }

    .navbar-links {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .navbar-links a {
        display: block;
        padding: 10px 14px;
        border-radius: 7px;
        color: #475467;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .2s ease, color .2s ease;
    }

    .navbar-links a:hover,
    .navbar-links a:focus-visible,
    .navbar-links a.active {
        background: #fff3dc;
        color: #b45309;
        outline: none;
    }

    .hero {
        min-height: 700px;
        background:
            linear-gradient(rgba(15, 23, 42, 0.18), rgba(15, 23, 42, 0.18)),
            url("https://people.com/thmb/I2DWw1Kao-x_dlmYtY4AvH2IZw4=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc():focal(734x279:736x281)/dog-breeds-12e3cd87407749d9b84a772ddf0746cc.jpg") center / cover no-repeat;
    }

    .dog-section {
        width: min(900px, calc(100% - 32px));
        margin: 42px auto 64px;
    }

    .dog-table {
        width: 100%;
        border-collapse: collapse;
        background: #fffdf9;
        text-align: center;
        box-shadow: 0 10px 22px rgba(91, 69, 24, 0.12);
    }

    .dog-table caption {
        margin-bottom: 10px;
        color: #17634f;
        font-family: Georgia, serif;
        font-size: clamp(22px, 3vw, 28px);
        font-weight: 700;
    }

    .dog-table th,
    .dog-table td {
        border: 1px solid #d9c08a;
    }

    .dog-table th {
        padding: 10px 12px;
        background: #51cec8;
        color: #172e2c;
        font-family: Georgia, serif;
        font-size: 16px;
    }

    .dog-table td {
        padding: 10px 12px;
        font-family: Georgia, serif;
        font-size: 16px;
    }

    .dog-table tbody tr:nth-child(odd) {
        background: #faecd4;
    }

    .dog-table tbody tr:nth-child(even) {
        background: #f2ddb3;
    }

    .dog-table tbody tr:hover {
        background: #f8e6be;
    }

    .dog-table input[type="checkbox"] {
        width: 14px;
        height: 14px;
        accent-color: #17634f;
    }

    .dog-photo {
        display: block;
        width: 70px;
        height: 70px;
        margin: 0 auto;
        border-radius: 8px;
        object-fit: cover;
    }

    .display-button {
        padding: 8px 16px;
        border: 1px solid #17634f;
        border-radius: 7px;
        background: #fff;
        color: #17634f;
        font-family: Georgia, serif;
        font-size: 16px;
        cursor: pointer;
    }

    .display-button:hover,
    .display-button:focus-visible {
        background: #17634f;
        color: #fff;
        outline: none;
    }

    @media (max-width: 560px) {
        .navbar {
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .navbar-links {
            width: 100%;
            justify-content: space-between;
        }

        .navbar-links a {
            padding: 8px 10px;
        }

        .hero {
            min-height: 220px;
        }

        .dog-section {
            width: calc(100% - 20px);
            margin-top: 28px;
            overflow-x: auto;
        }

        .dog-table {
            min-width: 720px;
        }
    }


</style>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="navbar-brand" href="#home" aria-label="Home">
            <img class="navbar-logo" src="Logo1.png" alt="Logo">
        </a>
        <ul class="navbar-links">
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero" aria-label="Dog background image"></section>

    <main id="home" class="dog-section">
        <table class="dog-table">
            <caption>4 different types of dogs</caption>
            <thead>
                <tr>
                    <th scope="col"></th>
                    <th scope="col"></th>
                    <th scope="col">Name</th>
                    <th scope="col">Age</th>
                    <th scope="col">Favorite Hobby</th>
                    <th scope="col">Short About Them</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="checkbox" aria-label="Select Aria"></td>
                    <td><img class="dog-photo" src="dog5.jpg" alt="Aria, a puppy"></td>
                    <td>Aria</td>
                    <td>3 years</td>
                    <td>Playing fetch</td>
                    <td><button class="display-button" type="button">Display</button></td>
                </tr>
                <tr>
                    <td><input type="checkbox" aria-label="Select Rex"></td>
                    <td><img class="dog-photo" src="dog3.jpg" alt="Rex, a German Shepherd"></td>
                    <td>Rex</td>
                    <td>4 years</td>
                    <td>Running &amp; training</td>
                    <td><button class="display-button" type="button">Display</button></td>
                </tr>
                <tr>
                    <td><input type="checkbox" aria-label="Select Vivienne"></td>
                    <td><img class="dog-photo" src="dog4.jpeg" alt="Vivienne, a brown puppy"></td>
                    <td>Vivienne</td>
                    <td>5 years</td>
                    <td>Learning tricks</td>
                    <td><button class="display-button" type="button">Display</button></td>
                </tr>
                <tr>
                    <td><input type="checkbox" aria-label="Select Elanor"></td>
                    <td><img class="dog-photo" src="dog5.jpg" alt="Elanor, a puppy"></td>
                    <td>Elanor</td>
                    <td>4 years</td>
                    <td>Playing &amp; cuddling </td>
                    <td><button class="display-button" type="button">Display</button></td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
